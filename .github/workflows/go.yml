# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]


env:
  AWS_REGION: eu-central-1
  AWS_ROLE_ARN: arn:aws:iam::641471776760:role/url-shortener-github-actions
  ECR_REPOSITORY: url-shortener
  ECR_REGISTRY: 641471776760.dkr.ecr.eu-central-1.amazonaws.com
  DEPLOY_ROLE_ARN: arn:aws:iam::641471776760:role/url-shortener-github-deploy
  FUNCTION_NAME: url-shortener

jobs:

  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./app
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.27'

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -v ./...


  image:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
    - uses: actions/checkout@v4

    - name: Configure AWS credentials (OIDC)
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ env.AWS_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Log in to Amazon ECR
      id: ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Log in to Amazon ECR Public
      run: |
        aws ecr-public get-login-password --region us-east-1 \
          | docker login --username AWS --password-stdin public.ecr.aws

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build (and push on main)
      uses: docker/build-push-action@v6
      with:
        context: ./app
        platforms: linux/arm64
        provenance: false
        push: ${{ github.event_name == 'push' }}
        tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max


  deploy:
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
    - name: Configure AWS credentials (deploy role)
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Deploy new image to Lambda
      run: |
        aws lambda update-function-code \
          --function-name "$FUNCTION_NAME" \
          --image-uri "$ECR_REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA"
        aws lambda wait function-updated --function-name "$FUNCTION_NAME"

    - name: Smoke test
      run: |
        URL=$(aws lambda get-function-url-config --function-name "$FUNCTION_NAME" \
          --query FunctionUrl --output text)
        curl --fail --silent --show-error --retry 3 "${URL}health"
